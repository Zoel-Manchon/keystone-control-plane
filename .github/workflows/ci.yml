name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed private key material
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)(data/|.*\.(key|p12|jks)$)' || true)
          if [[ -n "$forbidden" ]]; then
            echo "Private/generated key material must not be committed:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
          if git grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!README.md'; then
            echo "PEM private key material detected in the repository" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
