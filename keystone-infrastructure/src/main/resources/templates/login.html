<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso')}"></head>
<body>
<div class="ks-login">

  <section class="ks-login-poster">
    <div class="ks-brand">
      <span class="ks-brand-mark"></span>
      <span class="ks-brand-name">KEYSTONE</span>
    </div>

    <div>
      <p class="ks-eyebrow">Control plane · Identidad y OTA</p>
      <p class="ks-login-claim">
        Identidad de dispositivo, certificados y actualizaciones firmadas
        para flotas industriales.
      </p>
    </div>

    <p class="ks-fingerprint">Acceso restringido a operadores autorizados.</p>
  </section>

  <section class="ks-login-form">
    <h1 class="ks-title">Acceder</h1>
    <p class="ks-eyebrow" style="margin-bottom:var(--ks-6)">Consola de operaciones</p>

    <!--/* Deliberately generic message: we never reveal whether the username or
           the password was wrong. User enumeration is a gift to an attacker. */-->
    <div class="ks-alert" th:if="${param.error}" style="margin-bottom:var(--ks-4)">
      Credenciales no válidas.
    </div>
    <div class="ks-alert" th:if="${param.logout}"
         style="margin-bottom:var(--ks-4);border-color:var(--ks-border-strong);background:var(--ks-surface-3);color:var(--ks-text-muted)">
      Sesión cerrada.
    </div>

    <form th:action="@{/login}" method="post">
      <!--/* Explicit CSRF token. Thymeleaf usually injects it into th:action forms,
             but relying on that means a silent 403 the day the integration is not
             wired. An explicit hidden field always works. */-->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="ks-field">
        <label for="username">Operador</label>
        <input class="ks-input" type="text" id="username" name="username"
               autocomplete="username" required autofocus>
      </div>
      <div class="ks-field">
        <label for="password">Contraseña</label>
        <input class="ks-input" type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="ks-btn ks-btn--primary" style="width:100%;justify-content:center">
        Acceder
      </button>
    </form>
  </section>

</div>
</body>
</html>
