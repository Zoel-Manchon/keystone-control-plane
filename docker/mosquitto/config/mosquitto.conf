# Keystone :: broker configuration
#
# The broker exposes only the mTLS fleet listener. A plaintext/anonymous listener
# would undermine the device-identity boundary even if it were intended only for debugging.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- fleet listener: mutual TLS against the Keystone CA ---------------------------
listener 8883
allow_anonymous false

cafile   /mosquitto/certs/ca-chain.pem
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key

# The client MUST present a certificate. Without this line TLS still encrypts, but
# anyone can connect - which is exactly the property the whole PKI exists to remove.
require_certificate true

# The username becomes the certificate CN, which Keystone sets to the device id.
# That is what makes per-device topic authorisation possible without a password file.
use_identity_as_username true

# Revocation. Keystone rewrites this file on a schedule; a revoked device is refused
# at the next reload. Without a crlfile, revoking a certificate changes nothing here.
crlfile /mosquitto/certs/keystone.crl

# Devices may only touch their own namespace. The %u placeholder expands to the
# username, which is the certificate CN, which is the device id.
acl_file /mosquitto/config/acl
