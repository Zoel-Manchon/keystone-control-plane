spring:
  application:
    name: keystone

  datasource:
    url: jdbc:postgresql://localhost:15432/keystone
    username: keystone
    # Required explicitly (demo.sh generates an ephemeral value).
    password: ${KEYSTONE_DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. ddl-auto is NEVER set to 'update': that would let
      # Hibernate silently paper over a migration that failed to run.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    # Fail fast on a broken template instead of discovering it in production.
    check-template-location: true

  servlet:
    multipart:
      # A hard ceiling on firmware uploads. Without one, a single request can put the
      # server under memory pressure before any of your code runs.
      max-file-size: 32MB
      max-request-size: 33MB

server:
  # Safe local default: do not expose the HTTP control plane to the LAN by accident.
  # Production can override this behind a TLS-terminating reverse proxy.
  address: ${KEYSTONE_BIND_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        # The session cookie must be unreachable from JavaScript, so an XSS flaw
        # cannot be escalated into session theft.
        http-only: true
        # Lax still allows the post-login redirect while blocking cross-site POSTs.
        same-site: lax
        # Secure by default. demo.sh opts out explicitly because it runs on localhost HTTP.
        secure: ${KEYSTONE_COOKIE_SECURE:true}
  error:
    # Never return stack traces or messages to the client: that is reconnaissance.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  # Do not advertise the server implementation in response headers.
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

keystone:
  pki:
    keystore-path: ${KEYSTONE_CA_KEYSTORE:data/keystone-ca.p12}
    # Required explicitly. It protects the CA private keys: whoever holds them can
    # mint a trusted identity for any device.
    keystore-password: ${KEYSTONE_CA_PASSWORD}
    root-subject: "CN=Keystone Root CA, O=Keystone, C=ES"
    issuing-subject: "CN=Keystone Issuing CA, O=Keystone, C=ES"
    root-validity-years: 10
    issuing-validity-years: 5
    # Short-lived on purpose: rotation limits how long a stolen key stays useful.
    device-certificate-validity-days: 90
    expiry-sweep-ms: 86400000
  mqtt:
    broker-url: ssl://localhost:18883
    client-id: keystone-control-plane
    # Where the exporter drops what Mosquitto mounts read-only.
    certificate-path: ${KEYSTONE_MQTT_CERTS:docker/mosquitto/certs}
    broker-common-name: ${KEYSTONE_BROKER_CN:localhost}
    # This interval IS the revocation lag: a revoked device keeps publishing until
    # the broker reloads the CRL.
    crl-refresh-ms: 300000
  firmware:
    storage-path: ${KEYSTONE_FIRMWARE_PATH:data/firmware}
    # The Ed25519 key that signs update manifests. Kept apart from the CA key
    # material: different lifetimes, different blast radius, different custodian.
    signing-key-path: ${KEYSTONE_FIRMWARE_KEY:data/firmware-signing.key}

  security:
    # Required explicitly; there is intentionally no repository default password.
    dev-operator-password: ${KEYSTONE_OPERATOR_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # Expose the minimum. Every extra endpoint is extra attack surface.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.zoel.keystone: ${KEYSTONE_LOG_LEVEL:INFO}
    keystone.security.audit: INFO
    # Uncomment while debugging an unexpected 401/403:
    # org.springframework.security: DEBUG
